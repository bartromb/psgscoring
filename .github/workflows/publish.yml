name: publish

# ═══════════════════════════════════════════════════════════════════
# SETUP REQUIRED BEFORE FIRST USE:
# ───────────────────────────────────────────────────────────────────
# 1. Go to https://pypi.org/manage/account/publishing/
# 2. Add a new "pending publisher":
#      PyPI Project Name:     psgscoring
#      Owner:                 bartromb
#      Repository name:       psgscoring
#      Workflow name:         publish.yml
#      Environment name:      pypi        (match the environment below)
# 3. Go to repo → Settings → Environments → New environment → "pypi"
#    (no secrets needed; trusted publishing handles auth via OIDC)
#
# After setup, publishing works automatically:
#   → Create a GitHub Release (manually or via our release script)
#   → This workflow builds + uploads to PyPI with no API tokens
#
# Re-upload after a partial failure: re-run THIS workflow from the
# release event (Actions → failed run → "Re-run jobs"), or dispatch it
# manually — the publish step passes `skip-existing`, so files that
# already landed are skipped instead of failing the whole upload.
# NB: a manual dispatch from a branch skips the tag comparison (there
# is no tag to compare against); the pyproject-vs-wheel check and the
# artifact validation still run.
# ═══════════════════════════════════════════════════════════════════

on:
  release:
    types: [published]
  workflow_dispatch:   # re-upload path; see note above

# De tests-poort en de build-job voeren build-backend- en testcode uit van
# wat de tag ook maar aanwijst; die horen geen schrijf-token te erven.
# Alleen de publish-job krijgt id-token:write, en niets anders.
permissions:
  contents: read

jobs:
  # ─── Poort ─────────────────────────────────────────────────────────
  # Draait de VOLLEDIGE tests-workflow op de getagde commit. Zonder deze
  # stap publiceert een release ongeacht de staat van de suite: op
  # 30-08-2026 ging 0.31.0 naar PyPI terwijl `tests` sinds ten minste
  # 26-08 op elke push rood stond, en PyPI kent geen verwijderen -- alleen
  # yanken. De poort kost ~3 minuten en dat is de prijs niet waard om te
  # besparen.
  tests:
    name: Test gate
    uses: ./.github/workflows/tests.yml

  build:
    name: Build & validate distribution
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.11'
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine packaging
      - name: Build sdist and wheel
        run: python -m build
      - name: Verify version (pyproject ↔ wheel ↔ tag)
        # De wheelnaam is PEP 440-genormaliseerd; een rauwe stringvergelijking
        # tegen de tag hard-faalde op elke gestreepte spelling (v0.34.3-rc1)
        # en de oude [^-]+-sed kapte zulke versies af. Canoniek vergelijken
        # dus, en de tag-arm alleen op het release-event — bij een handmatige
        # dispatch vanaf een branch is GITHUB_REF_NAME "main" en was deze
        # stap een gegarandeerde exit 1 die als versiebumpfout las.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python - <<'EOF'
          import glob, os, re, sys, tomllib
          from packaging.version import Version

          with open("pyproject.toml", "rb") as f:
              py_ver = Version(tomllib.load(f)["project"]["version"])
          wheel = glob.glob("dist/*.whl")[0]
          wheel_ver = Version(re.match(r".*/psgscoring-([^-]+)-", wheel).group(1))
          print(f"pyproject: {py_ver}   wheel: {wheel_ver}")
          if py_ver != wheel_ver:
              sys.exit(f"::error::pyproject ({py_ver}) != wheel ({wheel_ver})")
          if os.environ["EVENT_NAME"] == "release":
              tag_ver = Version(os.environ["REF_NAME"].lstrip("v"))
              print(f"tag: {tag_ver}")
              if tag_ver != py_ver:
                  sys.exit(f"::error::tag ({tag_ver}) != pyproject ({py_ver})")
          else:
              print("workflow_dispatch: geen tag om tegen te vergelijken — overgeslagen")
          EOF
      - name: Validate artifacts (twine check + wheel install + sdist suite)
        # De poort testte tot 0.34.2rc1 alleen de source tree; de artifacts
        # die daadwerkelijk gepubliceerd werden valideerde niets. De sdist
        # van 0.34.1 scheepte een suite die bij collectie crasht (CHANGELOG.md
        # ontbrak), en een README die readme_renderer afkeurt zou pas als
        # HTTP 400 in de allerlaatste stap opduiken. Dit valideert wat er
        # écht naar PyPI gaat: metadata, geïnstalleerde wheel, sdist-suite.
        run: |
          set -euo pipefail
          twine check --strict dist/*
          python -m venv /tmp/wheel-check
          /tmp/wheel-check/bin/pip -q install dist/*.whl
          /tmp/wheel-check/bin/python -c "import psgscoring; print('wheel ok:', psgscoring.__version__)"
          mkdir /tmp/sdist-check && tar -xzf dist/*.tar.gz -C /tmp/sdist-check --strip-components=1
          python -m venv /tmp/sdist-venv
          /tmp/sdist-venv/bin/pip -q install "/tmp/sdist-check[full,ml,test]"
          cd /tmp/sdist-check && /tmp/sdist-venv/bin/python -m pytest tests -q -p no:cacheprovider
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/psgscoring/
    permissions:
      id-token: write   # required for trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # SHA-gepind: deze stap draagt de OIDC-identiteit die PyPI voor
        # psgscoring vertrouwt; een muteerbare ref (release/v1) is dan een
        # supply-chain-schakel die een tag-verplaatsing kan overnemen.
        # skip-existing dekt het her-uploadpad na een partiële storing.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          skip-existing: true
