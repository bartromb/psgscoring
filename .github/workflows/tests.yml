name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:   # allow manual trigger from UI
  # Aanroepbaar vanuit publish.yml, zodat een release NIET kan publiceren
  # terwijl de suite rood staat. Dat was tot 30-08-2026 wel het geval: 0.31.0
  # ging naar PyPI terwijl deze workflow op elke push faalde. Hergebruik in
  # plaats van de stappen dupliceren -- twee kopieën van een testopstelling
  # lopen uiteen, en dan is de poort er wel maar bewaakt hij iets anders.
  workflow_call:

jobs:
  lint:
    name: Lint (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install mypy
        # Pinned: unpinned, a new mypy release can turn the gate red without a
        # line of code changing, and a gate that falls over for external
        # reasons gets ignored.
        run: pip install mypy==2.3.0
      - name: mypy
        # Scope comes from [tool.mypy] in pyproject.toml -- the modules that
        # are already clean. See the comment there for the ratchet.
        run: mypy

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # see results for all Python versions even if one fails
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
      # ─── Checkout ──────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v5

      # ─── Python setup with pip cache ───────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # ─── System dependencies ───────────────────────────────────────
      # MNE-Python needs libgomp (OpenMP) at runtime for its parallel
      # routines; LightGBM (optional [full] extra) also needs it.
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1

      # ─── Install package ───────────────────────────────────────────
      # `ml` staat erbij omdat vijf tests de LightGBM-classifier NODIG hebben:
      # zonder lightgbm valt `detect_arousals` terug op het regelgebaseerde pad
      # en meldt `lgbm_available=False`, waarna de arousal-tests over het
      # werkpunt, het event-locked venster en de EMG-guard allemaal omvallen.
      # De suite stond daardoor sinds ten minste 26-08-2026 op elke push rood,
      # terwijl hij lokaal groen was -- daar zit lightgbm wel in de omgeving.
      #
      # De stap hierboven installeert libgomp1 al expliciet "LightGBM (optional
      # [full] extra) also needs it", dus de bedoeling stond er altijd al;
      # alleen de installatieregel trok de extra niet binnen.
      - name: Install psgscoring with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,ml]"

      # ─── Import smoke (no pytest needed) ───────────────────────────
      # Runs even if tests/ is empty; catches basic import regressions.
      - name: Import smoke test
        run: |
          python -c "
          import psgscoring
          print(f'psgscoring v{psgscoring.__version__}')
          print(f'Module path: {psgscoring.__file__}')
          "

      # ─── pytest ────────────────────────────────────────────────────
      - name: Run pytest
        run: |
          pytest tests/ -v --tb=short --color=yes

      # ─── Version consistency check ─────────────────────────────────
      # pyproject.toml and psgscoring/__init__.py must agree.
      # Version mismatch has been a recurring bug — catch it in CI.
      - name: Version consistency check
        run: |
          PYPROJECT_VER=$(grep '^version = ' pyproject.toml | head -1 | cut -d'"' -f2)
          INIT_VER=$(python -c "import psgscoring; print(psgscoring.__version__)")
          echo "pyproject.toml:        $PYPROJECT_VER"
          echo "psgscoring/__init__:   $INIT_VER"
          if [ "$PYPROJECT_VER" != "$INIT_VER" ]; then
              echo "::error::Version mismatch between pyproject.toml and __init__.py"
              exit 1
          fi
          echo "✓ Versions match"

  # ─── Golden-output regression (scoring characterization) ───────────
  # Freezes the paper-relevant scoring output (respiratory indices + event
  # digest) for 6 deterministic synthetic cases, so an unintended AHI/event
  # change fails CI with a readable diff. Gated by PSGSCORING_GOLDEN, so it
  # runs only in this dedicated single-version job — not the 3.9–3.12 matrix
  # (a same-environment characterization test is fragile across an unpinned
  # matrix). FLOAT_ATOL=0.25 in the test absorbs float/BLAS drift; a real
  # scoring change exceeds it and fails. Re-bless after an intended change:
  # `python tests/test_golden_output.py bless`.
  golden:
    name: Golden output (scoring regression)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgomp1
      # BEWUST zonder `ml`, anders dan de matrixjob hierboven. Deze job is
      # altijd groen geweest ZONDER lightgbm, en lokaal is hij groen MET
      # lightgbm -- de golden-uitvoer hangt dus niet van de classifier af. Dat
      # is een eigenschap die het waard is te blijven toetsen: de synthetische
      # EEG staat op 32 Hz en AROUSAL_LGBM_MIN_SF is 64, dus de hybride hoort
      # daar sowieso overgeslagen te worden. Zet `ml` er alleen bij als je die
      # controle bewust opgeeft.
      - name: Install psgscoring with test extras
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run golden-output harness
        env:
          PSGSCORING_GOLDEN: '1'
        run: |
          pytest tests/test_golden_output.py -v --tb=short --color=yes
