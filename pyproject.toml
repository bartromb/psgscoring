[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psgscoring"
version = "0.31.6"
description = "Open-source Python library for AASM-compliant automated polysomnography scoring"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.9"
authors = [
    {name = "Bart Rombaut", email = "bart.rombaut@gmail.com"},
    {name = "Briek Rombaut"},
    {name = "Cedric Rombaut"},
]
maintainers = [
    {name = "Bart Rombaut", email = "bart.rombaut@gmail.com"},
]
keywords = [
    "polysomnography", "PSG", "sleep", "AASM", "apnea", "hypopnea",
    "AHI", "respiratory", "scoring", "sleep-staging", "YASA",
    "hypoxic-burden",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "mne>=1.5,<2",
]

[project.optional-dependencies]
full = ["yasa>=0.6", "lightgbm>=3.0"]
ml   = ["lightgbm>=3.0"]
test = ["pytest>=7.0", "hypothesis>=6.0"]
plot = ["matplotlib>=3.5"]
denoise = ["PyWavelets>=1.4"]   # optional: flow_wavelet_denoise (BSD-3)
# Profilers, per docs/performance_policy.md §2. Never imported at runtime;
# py-spy attaches to a live worker (MIT), scalene gives the Python/C split
# (Apache-2.0). Declared so the policy names tools that are actually here.
dev  = ["py-spy>=0.3", "scalene>=1.5"]

[project.urls]
Homepage = "https://slaapkliniek.be"
Repository = "https://github.com/bartromb/psgscoring"
Documentation = "https://github.com/bartromb/psgscoring/wiki"
Issues = "https://github.com/bartromb/psgscoring/issues"
Changelog = "https://github.com/bartromb/psgscoring/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["psgscoring*"]

[tool.setuptools.package-data]
"psgscoring" = ["data/*.txt", "py.typed"]

[tool.mypy]
# Pragmatisch, en bewust GESCOPEERD. Een gate die bij invoering rood staat
# wordt genegeerd -- dat is precies wat er met de ruff-gate van YASAFlaskified
# gebeurde, die drie releases lang rood stond zonder gevolg.
#
# Over de hele codebase geeft mypy nu 96 fouten, vrijwel allemaal `assignment`
# (`x = None` gevolgd door `x = "iets"`) en `operator` (numpy). Die opruimen is
# een annotatiecampagne door bestaande code, en die is uitdrukkelijk niet de
# bedoeling. In plaats daarvan draait de CI mypy op de modules die AL schoon
# zijn; daar blokkeert hij dus echt. Zie de `files`-lijst hieronder.
#
# RATEL: modules worden aan de lijst toegevoegd zodra ze op nul staan, nooit
# verwijderd. Stand 2026-08-14 van wat er nog buiten valt:
#   arousal.py 30 · pipeline.py 18 · signal_quality.py 12 · classify.py 12
#   breath_scoring.py 7 · spo2.py 5 · respiratory.py 1
ignore_missing_imports = true
follow_imports = "silent"
files = [
    "psgscoring/compare",
    "psgscoring/_types.py",
    "psgscoring/constants.py",
    "psgscoring/ml_classifier.py",
    "psgscoring/profiles.py",
    "psgscoring/utils.py",
]
